name: Release Android APK

on:
  push:
    tags:
      - 'apk-release-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Write Android SDK local.properties
        working-directory: android-client
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build debug APK
        working-directory: android-client
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Prepare release asset
        run: |
          mkdir -p artifacts
          cp android-client/app/build/outputs/apk/debug/app-debug.apk artifacts/phonemoneyai-video-runner-debug.apk

      - name: Publish GitHub Release with APK asset
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/phonemoneyai-video-runner-debug.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
          overwrite_files: true
